# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 需要上一版提交来 diff 出本次改动的文章，故检出最近两条历史
      - name: Checkout (git history for IndexNow diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow：只把本次新增/修改的内容页主动推给 Bing/Yandex（Google 不支持 IndexNow）
      - name: Ping IndexNow with changed pages
        env:
          INDEXNOW_KEY: c55f95d1b0884f3bbe8bf914a7a7bc32
          HOST: cjraft.github.io
        run: |
          # 首次提交没有父节点，无法 diff，直接跳过
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "no parent commit, skip"; exit 0
          fi
          # 本次提交里新增(A)/修改(M)的内容页 → 站点 URL
          #   content/articles/foo.md   -> https://HOST/articles/foo/
          #   content/research/x.md     -> https://HOST/research/x/
          #   content/articles/_index.md-> https://HOST/articles/
          #   content/about.md          -> https://HOST/about/
          # 限定 content 目录再 grep .md，可同时覆盖子目录(含 research)与顶层单页
          URLS=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- content \
            | grep -E '\.md$' \
            | sed -E 's#^content/##; s#\.md$##; s#/_index$##' \
            | sed -E "s#^#https://${HOST}/#; s#\$#/#")
          if [ -z "$URLS" ]; then
            echo "no content page changes, skip"; exit 0
          fi
          echo "submitting to IndexNow:"; echo "$URLS"
          BODY=$(jq -n \
            --arg h "$HOST" \
            --arg k "$INDEXNOW_KEY" \
            --argjson u "$(printf '%s\n' "$URLS" | jq -R . | jq -s .)" \
            '{host:$h, key:$k, keyLocation:("https://"+$h+"/"+$k+".txt"), urlList:$u}')
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" -w "\nHTTP %{http_code}\n"
